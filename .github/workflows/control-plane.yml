name: KUA Control Plane

on:
  push:
    branches: [main]
    paths:
      - 'cloud/control-plane/**'
      - '.github/workflows/control-plane.yml'
  workflow_dispatch:

concurrency:
  group: kua-control-plane-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ncaicloud
  GCP_REGION: us-central1
  SERVICE: kua-control-plane

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run control-plane tests
        working-directory: cloud/control-plane
        run: npm ci && npm test

      - name: Build and push image with Cloud Build
        working-directory: cloud/control-plane
        run: |
          gcloud builds submit . \
            --project="$GCP_PROJECT_ID" \
            --config=cloudbuild.yaml \
            --gcs-source-staging-dir="gs://ncaicloud-kua-control-plane-build/source" \
            --substitutions="_TAG=${GITHUB_SHA}"

      # Configuration lives in GitHub:
      #   vars    (not sensitive): KUA_GOOGLE_CLIENT_ID, KUA_BILLING_PROVIDER (polar|stripe),
      #                            KUA_POLAR_SERVER (sandbox|production), KUA_POLAR_PRODUCT_{PRO,TEAM}[_YEARLY],
      #                            KUA_STRIPE_PRICE_{PRO,TEAM}[_YEARLY], KUA_STRIPE_PORTAL_CONFIGURATION
      #   secrets (sensitive):     KUA_GOOGLE_CLIENT_SECRET, KUA_SESSION_SECRET,
      #                            KUA_POLAR_ACCESS_TOKEN, KUA_POLAR_WEBHOOK_SECRET,
      #                            KUA_STRIPE_SECRET_KEY, KUA_STRIPE_WEBHOOK_SECRET
      # Sensitive values are copied to Secret Manager (only when they change) so
      # Cloud Run reads them from there instead of plain env vars. Anything not
      # configured is left out: the service starts without that feature.
      - name: Sync secrets to Secret Manager
        id: secrets
        env:
          KUA_GOOGLE_CLIENT_SECRET: ${{ secrets.KUA_GOOGLE_CLIENT_SECRET }}
          KUA_SESSION_SECRET: ${{ secrets.KUA_SESSION_SECRET }}
          KUA_STRIPE_SECRET_KEY: ${{ secrets.KUA_STRIPE_SECRET_KEY }}
          KUA_STRIPE_WEBHOOK_SECRET: ${{ secrets.KUA_STRIPE_WEBHOOK_SECRET }}
          KUA_POLAR_ACCESS_TOKEN: ${{ secrets.KUA_POLAR_ACCESS_TOKEN }}
          KUA_POLAR_WEBHOOK_SECRET: ${{ secrets.KUA_POLAR_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          refs=()
          # secret name in GitHub/Secret Manager -> env var the service reads
          for pair in KUA_GOOGLE_CLIENT_SECRET:GOOGLE_CLIENT_SECRET KUA_SESSION_SECRET:KUA_SESSION_SECRET \
                      KUA_STRIPE_SECRET_KEY:STRIPE_SECRET_KEY KUA_STRIPE_WEBHOOK_SECRET:STRIPE_WEBHOOK_SECRET \
                      KUA_POLAR_ACCESS_TOKEN:POLAR_ACCESS_TOKEN KUA_POLAR_WEBHOOK_SECRET:POLAR_WEBHOOK_SECRET; do
            name="${pair%%:*}"; target="${pair##*:}"; value="${!name}"
            current="$(gcloud secrets versions access latest --secret="$name" --project="$GCP_PROJECT_ID" 2>/dev/null || true)"
            if [ -z "$value" ]; then
              # Not in GitHub: keep a value already stored in Secret Manager, otherwise leave it out.
              if [ -n "$current" ]; then refs+=("$target=$name:latest"); echo "$name: using the value in Secret Manager"
              else echo "::notice::$name is not set in GitHub secrets; skipped"; fi
              continue
            fi
            if [ "$value" != "$current" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --project="$GCP_PROJECT_ID" --data-file=- >/dev/null
              # Keep only the newest version (each active version is billed).
              gcloud secrets versions list "$name" --project="$GCP_PROJECT_ID" --filter="state!=DESTROYED" \
                --sort-by="~createTime" --format="value(name.basename())" | tail -n +2 | while read -r version; do
                gcloud secrets versions destroy "$version" --secret="$name" --project="$GCP_PROJECT_ID" --quiet >/dev/null
              done
              echo "$name updated"
            fi
            refs+=("$target=$name:latest")
          done
          echo "refs=$(IFS=,; echo "${refs[*]}")" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run service
        env:
          KUA_GOOGLE_CLIENT_ID: ${{ vars.KUA_GOOGLE_CLIENT_ID }}
          KUA_STRIPE_PRICE_PRO: ${{ vars.KUA_STRIPE_PRICE_PRO }}
          KUA_STRIPE_PRICE_TEAM: ${{ vars.KUA_STRIPE_PRICE_TEAM }}
          KUA_STRIPE_PRICE_PRO_YEARLY: ${{ vars.KUA_STRIPE_PRICE_PRO_YEARLY }}
          KUA_STRIPE_PRICE_TEAM_YEARLY: ${{ vars.KUA_STRIPE_PRICE_TEAM_YEARLY }}
          KUA_STRIPE_PORTAL_CONFIGURATION: ${{ vars.KUA_STRIPE_PORTAL_CONFIGURATION }}
          KUA_BILLING_PROVIDER: ${{ vars.KUA_BILLING_PROVIDER }}
          KUA_POLAR_SERVER: ${{ vars.KUA_POLAR_SERVER }}
          KUA_POLAR_PRODUCT_PRO: ${{ vars.KUA_POLAR_PRODUCT_PRO }}
          KUA_POLAR_PRODUCT_TEAM: ${{ vars.KUA_POLAR_PRODUCT_TEAM }}
          KUA_POLAR_PRODUCT_PRO_YEARLY: ${{ vars.KUA_POLAR_PRODUCT_PRO_YEARLY }}
          KUA_POLAR_PRODUCT_TEAM_YEARLY: ${{ vars.KUA_POLAR_PRODUCT_TEAM_YEARLY }}
          SECRET_REFS: ${{ steps.secrets.outputs.refs }}
        run: |
          set -euo pipefail
          env_vars="NODE_ENV=production,GCP_DATABASE_MODE=datastore,GCP_DATABASE_ID=kua-control-plane,CONTROL_PLANE_URL=https://api.kuadashboard.navarrocarter.com,FRONTEND_URL=https://kuadashboard.navarrocarter.com,GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID"
          # Optional values: only passed when the GitHub variable is set.
          for pair in KUA_GOOGLE_CLIENT_ID:GOOGLE_CLIENT_ID KUA_STRIPE_PRICE_PRO:STRIPE_PRICE_PRO KUA_STRIPE_PRICE_TEAM:STRIPE_PRICE_TEAM \
                      KUA_STRIPE_PRICE_PRO_YEARLY:STRIPE_PRICE_PRO_YEARLY KUA_STRIPE_PRICE_TEAM_YEARLY:STRIPE_PRICE_TEAM_YEARLY \
                      KUA_STRIPE_PORTAL_CONFIGURATION:STRIPE_PORTAL_CONFIGURATION KUA_BILLING_PROVIDER:BILLING_PROVIDER \
                      KUA_POLAR_SERVER:POLAR_SERVER KUA_POLAR_PRODUCT_PRO:POLAR_PRODUCT_PRO KUA_POLAR_PRODUCT_TEAM:POLAR_PRODUCT_TEAM \
                      KUA_POLAR_PRODUCT_PRO_YEARLY:POLAR_PRODUCT_PRO_YEARLY KUA_POLAR_PRODUCT_TEAM_YEARLY:POLAR_PRODUCT_TEAM_YEARLY; do
            name="${pair%%:*}"; value="${!name}"
            if [ -n "$value" ]; then env_vars="$env_vars,${pair##*:}=$value"; fi
          done
          secrets_args=()
          if [ -n "$SECRET_REFS" ]; then secrets_args=(--set-secrets="$SECRET_REFS"); else secrets_args=(--clear-secrets); fi
          gcloud run deploy "$SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/kua-control-plane/$SERVICE:$GITHUB_SHA" \
            --platform=managed \
            --service-account="kua-control-plane-run@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min=0 \
            --max=3 \
            --memory=256Mi \
            --cpu=1 \
            --set-env-vars="$env_vars" \
            "${secrets_args[@]}"
