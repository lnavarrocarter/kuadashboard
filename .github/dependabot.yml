version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/frontend", "/vscode", "/docs", "/mcpb"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
