steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/kua-control-plane/kua-control-plane:$_TAG
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/kua-control-plane/kua-control-plane:$_TAG
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/kua-control-plane/kua-control-plane:$_TAG
# Run the build as the deploy account instead of the project's default
# Compute Engine account (which has broad Editor access). The deploy account
# already writes to Artifact Registry and the source bucket; it needs
# roles/logging.logWriter and roles/iam.serviceAccountUser on itself.
serviceAccount: projects/$PROJECT_ID/serviceAccounts/kua-control-plane-deployer@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
